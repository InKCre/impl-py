[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "inkcre-ext-capture"
version = "0.1.0"
description = "Read shared Capture graphs in Python peers"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.11.7,<3.0.0",
]

[project.entry-points."inkcre.core.extensions"]
capture = "extensions.capture:Extension"

[tool.inkcre-extension]
name = "inkcre/capture"
nickname = "随手收集"
host-sdk = "core-py"
host-sdk-version = ">=0.3.3 <0.4.0"

[tool.setuptools]
packages = ["extensions.capture"]

[tool.setuptools.package-dir]
"extensions.capture" = "."
