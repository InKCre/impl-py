[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "inkcre-ext-twitter"
version = "0.5.0"
description = "Twitter extension for InKCre"
authors = [{ name = "Lan_zhijiang", email = "lanzhijiang@foxmail.com" }]
dependencies = [
  "authlib>=1.7.2,<2.0.0",
  "aiohttp>=3.14.1,<4.0.0",
  "datadot>=1.0.0,<2.0.0",
  "fastapi>=0.139.2,<0.140.0",
  "httpx>=0.28.1,<0.29.0",
  "pydantic>=2.12.0,<3.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "sqlmodel>=0.0.24,<0.0.25",
  "twikit>=2.3.3,<3.0.0",
]
requires-python = ">=3.12,<3.13"
license = "MIT"

[project.entry-points."inkcre.core.extensions"]
twitter = "extensions.twitter:Extension"

[tool.inkcre-extension]
name = "inkcre/twitter"
nickname = "Twitter"
host-sdk = "core-py"
host-sdk-version = ">=0.3.1 <0.4.0"

[tool.setuptools]
packages = ["extensions.twitter"]

[tool.setuptools.package-dir]
"extensions.twitter" = "."
