[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "inkcre-ext-mail"
version = "0.4.0"
description = "Mail extension for InKCre"
authors = [{ name = "Lan_zhijiang", email = "lanzhijiang@foxmail.com" }]
dependencies = [
  "beautifulsoup4>=4.12.0,<5.0.0",
  "fastapi>=0.139.2,<0.140.0",
  "imapclient>=3.1,<4",
  "pydantic>=2.11.7,<3.0.0",
  "sqlmodel>=0.0.24,<0.0.25",
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"

[project.entry-points."inkcre.core.extensions"]
mail = "extensions.mail:Extension"

[tool.inkcre-extension]
name = "inkcre/mail"
nickname = "Mail"
host-sdk = "core-py"
host-sdk-version = ">=0.2.0 <0.4.0"

[tool.setuptools]
packages = ["extensions.mail"]

[tool.setuptools.package-dir]
"extensions.mail" = "."
