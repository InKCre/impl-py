name: Heroku preview delivery
description: Release and probe prebuilt process images for one deterministic preview

inputs:
  core_database_password:
    description: Preview native runtime role password
    required: true
  head_sha:
    description: Exact pull request head commit to deploy
    required: true
  extension_registry_url:
    description: Verified sibling static Registry origin for this preview
    required: true
  heroku_api_key:
    description: Heroku authorization for preview app lifecycle
    required: true
  jwt_secret:
    description: Repository signing secret shared by canonical deployments
    required: true
  neon_api_key:
    description: Neon authorization for resolving the preview connection
    required: true
  neon_project_id:
    description: Neon project containing preview branches
    required: true
  postgrest_database_password:
    description: Preview PostgREST authenticator role password
    required: true
  pr_number:
    description: Pull request number
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned deployment CLIs
      shell: bash
      run: npm install --global heroku@11.8.1

    - name: Resolve exact matching Neon preview branch
      id: neon
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon_api_key }}
        NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" resolve-neon

    - name: Normalize inherited provider roles on first bootstrap
      shell: bash
      env:
        BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        HEAD_SHA: ${{ inputs.head_sha }}
        MIGRATION_DATABASE_URL: ${{ steps.neon.outputs.migration_database_url }}
        NEON_API_KEY: ${{ inputs.neon_api_key }}
        NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" normalize-roles

    - name: Initialize and verify exact preview database contract
      id: database
      shell: bash
      env:
        CORE_DATABASE_PASSWORD: ${{ inputs.core_database_password }}
        HEAD_SHA: ${{ inputs.head_sha }}
        MIGRATION_DATABASE_URL: ${{ steps.neon.outputs.migration_database_url }}
        POSTGREST_DATABASE_PASSWORD: ${{ inputs.postgrest_database_password }}
        SOURCE_DATABASE_URL: ${{ steps.neon.outputs.runtime_database_url }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" converge-database

    - name: Create or verify deterministic Heroku apps
      id: heroku
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" resolve-apps

    - name: Push and release preview peer transports
      id: release
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        DATABASE_URL: ${{ steps.database.outputs.runtime_database_url }}
        EXTENSION_REGISTRY_URL: ${{ inputs.extension_registry_url }}
        HAS_POSTGREST_RELEASE: ${{ steps.heroku.outputs.has_postgrest_release }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        JWT_SECRET: ${{ inputs.jwt_secret }}
        PR_NUMBER: ${{ inputs.pr_number }}
        POSTGREST_APP_NAME: ${{ steps.heroku.outputs.postgrest_app_name }}
        POSTGREST_DATABASE_URL: ${{ steps.database.outputs.postgrest_database_url }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" release

    - name: Converge preview Peer advertisement
      id: advertisement
      shell: bash
      env:
        DATABASE_URL: ${{ steps.database.outputs.runtime_database_url }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" advertise

    - name: Probe deployed preview
      id: probe
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        POSTGREST_APP_NAME: ${{ steps.heroku.outputs.postgrest_app_name }}
        POSTGREST_URL: ${{ steps.heroku.outputs.postgrest_url }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" probe

    - name: Report runtime stages even after failure
      if: ${{ always() }}
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        EXTENSION_REGISTRY_URL: ${{ inputs.extension_registry_url }}
        BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        DATABASE_RESULT: ${{ steps.database.outcome }}
        DATABASE_BEFORE: ${{ steps.database.outputs.database_before }}
        DATABASE_AFTER: ${{ steps.database.outputs.database_after }}
        RELEASE_RESULT: ${{ steps.release.outcome }}
        ADVERTISEMENT_RESULT: ${{ steps.advertisement.outcome }}
        PROBE_RESULT: ${{ steps.probe.outcome }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/preview_delivery.sh" summarize
