name: Preview application

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: preview-application-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: impl-py preview checks
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Checkout trusted preview scope controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check the complete exact-head pull request diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/automation/preview_workflow.sh application-required

  build:
    name: Build exact-head preview artifacts
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout trusted build controller
        id: controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .delivery
          persist-credentials: false

      - name: Verify exact pull request head
        uses: ./.delivery/.github/actions/preview-verify
        with:
          github_token: ${{ github.token }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Checkout exact pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false

      - name: Set up frozen Extension preview tooling
        uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version-file: source/.python-version
          version: 2.28.0

      - name: Install frozen Extension preview tooling
        working-directory: source
        run: >-
          pdm install --no-self --no-default --group extension-preview --frozen-lockfile

      - name: Build exact-head Extension wheels and sibling Registry facade
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/preview-artifact
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: source
        run: bash ../.delivery/scripts/automation/preview_workflow.sh build-extensions

      - name: Build peer transport images without deployment secrets
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/preview-artifact
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_DIRECTORY: ${{ github.workspace }}/source
        run: bash .delivery/scripts/automation/preview_workflow.sh build-images

      - name: Transfer the exact-head Registry and peer images
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-artifact
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      - name: Report when candidate artifacts are unavailable
        if: ${{ failure() && steps.controller.outcome == 'success' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
        run: bash .delivery/scripts/automation/preview_workflow.sh summarize

  deploy:
    name: impl-py preview
    needs: build
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout only the trusted delivery implementation
        id: controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .delivery
          persist-credentials: false

      - name: Require one exact artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'

      - name: Download the build job's artifacts from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/preview-artifact
          merge-multiple: true

      - name: Validate static Registry and load the exact-head images
        id: artifact
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/preview-artifact
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash .delivery/scripts/automation/preview_workflow.sh validate-identity
          bash .delivery/scripts/automation/preview_workflow.sh load-artifact

      - name: Reverify preview authority before Pages delivery
        uses: ./.delivery/.github/actions/preview-verify
        with:
          github_token: ${{ github.token }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Deploy exact-head sibling Registry to isolated Pages branch
        id: registry
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.120.0
          workingDirectory: .delivery
          command: >-
            pages deploy ${{ runner.temp }}/preview-artifact/registry
            --project-name=${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=false

      - name: Reverify preview authority before Heroku delivery
        uses: ./.delivery/.github/actions/preview-verify
        with:
          github_token: ${{ github.token }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Deliver preview
        id: delivery
        uses: ./.delivery/.github/actions/preview-delivery
        with:
          core_database_password: ${{ secrets.CORE_DATABASE_PASSWORD }}
          extension_registry_url: >-
            https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}.pages.dev
          head_sha: ${{ github.event.pull_request.head.sha }}
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}
          neon_project_id: ${{ vars.NEON_PROJECT_ID }}
          postgrest_database_password: ${{ secrets.POSTGREST_DATABASE_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Report complete or partial candidate delivery
        if: ${{ always() && steps.controller.outcome == 'success' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
          REGISTRY_RESULT: ${{ steps.registry.outcome }}
          REGISTRY_SNAPSHOT: ${{ steps.registry.outputs.deployment-url }}
          DELIVERY_RESULT: ${{ steps.delivery.outcome }}
        run: bash .delivery/scripts/automation/preview_workflow.sh summarize

  cleanup:
    name: impl-py preview cleanup
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout trusted cleanup controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .delivery
          persist-credentials: false

      - name: Install pinned Heroku CLI
        run: npm install --global heroku@11.8.1

      - name: Verify sibling Registry cleanup identity
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .delivery/scripts/automation/preview_workflow.sh validate-identity

      - name: Replace sibling Registry alias with trusted tombstone
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.120.0
          workingDirectory: .delivery/.github/pages-preview-closed
          command: >-
            pages deploy .
            --project-name=${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.workflow_sha }}
            --commit-dirty=false

      - name: Delete exact deterministic apps
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .delivery/scripts/automation/preview_workflow.sh cleanup-apps
