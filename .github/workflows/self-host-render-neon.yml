name: Deploy self-hosted InKCre

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-render-neon-${{ github.repository }}
  cancel-in-progress: false

env:
  PDM_CHECK_UPDATE: "false"

jobs:
  deploy:
    name: Converge Render and Neon deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate required fork settings
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_SERVICE_PREFIX: ${{ vars.RENDER_SERVICE_PREFIX }}
        run: bash scripts/automation/self_host.sh validate
      - name: Set up Python and PDM
        uses: pdm-project/setup-pdm@v4.5
        with:
          python-version-file: .python-version
          version: 2.28.0
          cache: true

      - name: Install locked runtime dependencies
        run: pdm install -G app --prod --no-editable --frozen-lockfile

      - name: Resolve the Neon default branch owner coordinates
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: bash scripts/automation/self_host.sh resolve-neon

      - name: Converge exact self-host deployment
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MIGRATION_DATABASE_URL: ${{ steps.neon.outputs.migration_database_url }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_SERVICE_PREFIX: ${{ vars.RENDER_SERVICE_PREFIX }}
          SOURCE_DATABASE_URL: ${{ steps.neon.outputs.source_database_url }}
        run: |
          set -euo pipefail
          pdm run python scripts/deploy_render_neon.py \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --service-prefix "$RENDER_SERVICE_PREFIX" \
            --result-file "$RUNNER_TEMP/render-neon.json"

      - name: Publish non-secret deployment coordinates
        env:
          RESULT_FILE: ${{ runner.temp }}/render-neon.json
        run: bash scripts/automation/self_host.sh summarize
