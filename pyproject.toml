[project]
name = "inkcre-core"
version = "0.8.0"
description = "Backend of InKCre."
authors = [{ name = "Lan_zhijiang", email = "lanzhijiang@foxmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inkcre-extension-runtime-core-py @ https://github.com/InKCre/ext-reg/releases/download/runtime-core-py-v0.2.0/inkcre_extension_runtime_core_py-0.2.0-py3-none-any.whl",
    "authlib>=1.7.2,<2.0.0",
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "packaging (>=25.0,<26.0)",
    "pip (>=25.2,<26.0)",
    "semantic-version (>=2.10.0,<3.0.0)",
    "sqlalchemy[asyncio]<3.0.0,>=2.0.41",
    "aiohttp (>=3.14.1,<4.0.0)",
    "tencentcloud-sdk-python-lke (>=3.0.1427,<4.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)",
    "openai (>=1.97.1,<2.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "pgvector (>=0.4.1,<0.5.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "requests (>=2.33.0,<3.0.0)",
    "httpx>=0.28.1,<0.29.0",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "datadot (>=1.0.0,<2.0.0)",
    "apscheduler>=3.11.0",
    "html2text>=2025.4.15",
    "logtail-python>=0.3.0",
    "python-telegram-bot==22.8",
    "alembic>=1.16.4",
    "alembic-utils>=0.8.8",
    "alembic-postgresql-enum>=1.8.0",
    "PyJWT>=2.10.1",
    # Fixed built-in extension profile
    "beautifulsoup4>=4.12.0,<5.0.0",
    "chardet>=5.0.0,<6.0.0",
    "lxml>=5.0.0,<7.0.0",
    "readability-lxml>=0.8.0,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
    "av>=18.0.0,<19.0.0",
    "pypdf>=6.14.2,<7.0.0",
    "puremagic>=2.2.0,<3.0.0",
    "feedparser>=6.0.12,<7.0.0",
    "trafilatura>=2.1.0,<3.0.0",
    "PyGithub>=2.8.1,<3.0.0",
    "twikit>=2.3.3,<3.0.0",
    "jsonschema<5,>=4.25",
    "croniter<7,>=6",
    "imapclient<4,>=3.1",
    "mcp>=2.1.1,<2.2.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "Radicale==3.8.3",
    "vobject<0.10,>=0.9.9",
    "anyio<5,>=4",
]

[dependency-groups]
extension-preview = [
    "build>=1.4.0,<2.0.0",
    "inkcre-extension-toolkit[cli] @ https://github.com/InKCre/ext-reg/releases/download/toolkit-v0.5.0/inkcre_extension_toolkit-0.5.0-py3-none-any.whl",
    "setuptools>=80.0.0,<81.0.0",
]
extension-publisher = [
    "build>=1.3.0,<2.0.0",
    "inkcre-extension-toolkit[cli] @ https://github.com/InKCre/ext-reg/releases/download/toolkit-v0.5.0/inkcre_extension_toolkit-0.5.0-py3-none-any.whl",
    "setuptools>=80.0.0,<81.0.0",
    "uv>=0.8.0,<1.0.0",
]
dev = [
    "build>=1.3.0,<2.0.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "pre-commit>=4.4.0",
    "ruff>=0.14.10",
    "pyrefly==1.1.1",
    "setuptools>=80.0.0,<81.0.0",
    "towncrier==25.8.0",
]

[tool.poetry]
package-mode = false

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python run.py"
doctor = "python scripts/doctor.py"
lint = "ruff check --no-cache ."
format = "ruff format ."
"format:check" = "ruff format --check ."
typecheck = "pyrefly check --min-severity=warn --output-format=min-text --progress-bar=no"
test = "python -m pytest -q"
"test:database" = "bash scripts/automation/repository_check.sh database-tests"
"test:acceptance" = "python -m pytest -q -m acceptance tests/semantic_retrieval/acceptance"
"test:organization-acceptance" = "python -m pytest -q -s tests/organization/acceptance/test_black_box.py"
"check:lock" = "python scripts/check_lock.py"
"lint:migrations" = "ruff check --no-cache migrations/env.py migrations/metadata.py migrations/settings.py scripts/_tooling.py scripts/doctor.py scripts/check_lock.py scripts/check_migration_history.py scripts/database_manifest.py scripts/sanitize_preview_base.py tests/migrations"
"test:migrations" = "python -m pytest -q tests/migrations"
"check:migrations" = { composite = ["lint:migrations", "check:migration-history"] }
"check:automation" = { shell = "bash -n scripts/automation/*.sh" }
"check:migration-history" = "python scripts/check_migration_history.py {args}"
"check:releases" = "python scripts/release.py check {args}"
"build:extension-preview" = "python scripts/build_extension_preview.py {args}"
"release:prepare" = "python scripts/release.py prepare {args}"
"check:foundation" = { composite = ["doctor", "check:lock", "check:migrations", "check:automation"] }
"lint:database-imports" = "ruff check --config ruff.database.toml ."
"lint:database-ownership" = "python scripts/check_database_boundaries.py"
"lint:database-boundaries" = { composite = ["lint:database-imports", "lint:database-ownership"] }
"check" = { composite = ["check:foundation", "format:check", "lint", "lint:database-boundaries", "typecheck", "test"] }
"db:revision" = "alembic revision -m {args}"
"db:generate" = "alembic revision --autogenerate -m {args}"
"db:record" = "python scripts/check_migration_history.py --record-new"
"db:migrate" = "alembic upgrade head"
"db:init" = "python scripts/database.py init {args}"
"db:provision-roles" = "python scripts/database.py provision-roles"
"db:reconcile-builtins" = "python scripts/database.py reconcile-builtins"
"db:seed-dev" = "python scripts/database.py seed-dev"
"db:ready" = "python scripts/database.py ready {args}"
"db:reset-dev" = "python scripts/database.py reset-dev {args}"
"db:contract" = "python scripts/database.py contract --json"
"db:schema" = "python scripts/database.py schema --json"
"db:manifest" = "python scripts/database_manifest.py"
"db:verify-postgrest" = "python scripts/verify_postgrest_contract.py {args}"
"db:sanitize-preview-base" = "python scripts/sanitize_preview_base.py"
"db:downgrade" = "alembic downgrade {args}"
"container:web" = "python scripts/container.py web"
"container:migrate" = "python scripts/container.py db migrate"
"container:ready" = "python scripts/container.py ready"
"dev:database" = "python scripts/dev_database.py {args}"

[tool.pyrefly]
project-includes = [
    "app",
    "extensions",
    "libs",
    "migrations",
    "scripts",
    "tests",
    "utils",
    "run.py",
]
search-path = [".", "scripts"]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:co_lnotab is deprecated, use co_lines instead\\.:DeprecationWarning:js2py_\\.utils\\.injector",
]
markers = [
    "acceptance: explicit credentialed Human-reviewed acceptance",
    "integration: requires external services or a disposable database",
]

[build-system]
requires = []
build-backend = "none"
