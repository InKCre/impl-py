repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args:
          - -shellcheck=
          - -pyflakes=

  - repo: local
    hooks:
      - id: check-format
        name: Check Ruff formatting
        entry: pdm run format:check
        language: system
        files: ^(.*\.py|pyproject\.toml|ruff\.toml)$
        exclude: ^(cli/|\.agents/|tasks/)
        pass_filenames: false
      - id: check-lint
        name: Check Ruff lint
        entry: pdm run lint
        language: system
        files: ^(.*\.py|pyproject\.toml|ruff\.toml|\.pre-commit-config\.yaml)$
        exclude: ^(cli/|\.agents/|tasks/)
        pass_filenames: false
      - id: typecheck
        name: Check Pyrefly types
        entry: pyrefly check --min-severity=warn --output-format=min-text --progress-bar=no
        language: system
        files: ^(app/|extensions/|libs/|migrations/|scripts/|tests/|utils/|run\.py$|pyproject\.toml$|pdm\.lock$)
        pass_filenames: false
      - id: check-lock
        name: Check PDM lock
        entry: python scripts/check_lock.py
        language: system
        files: ^(pyproject\.toml|pdm\.lock)$
        pass_filenames: false
      - id: lint-migrations
        name: Lint migration contract
        entry: ruff check --no-cache migrations/env.py migrations/metadata.py migrations/settings.py scripts/_tooling.py scripts/doctor.py scripts/check_lock.py scripts/check_migration_history.py scripts/database_manifest.py scripts/sanitize_preview_base.py tests/migrations
        language: system
        files: ^(alembic\.ini|migrations/|scripts/|tests/migrations/)
        pass_filenames: false
      - id: test-migrations
        name: Test migration contract
        entry: python -m pytest -q tests/migrations
        language: system
        files: ^(alembic\.ini|migrations/|tests/migrations/)
        pass_filenames: false
