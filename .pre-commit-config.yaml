repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args:
          - -shellcheck=
          - -pyflakes=

  - repo: local
    hooks:
      - id: check-format
        name: Check Ruff formatting
        entry: pdm run format:check
        language: system
        files: ^(.*\.py|pyproject\.toml|ruff\.toml)$
        exclude: ^(cli/|\.agents/|tasks/)
        pass_filenames: false
      - id: check-lint
        name: Check Ruff lint
        entry: pdm run lint
        language: system
        files: ^(.*\.py|pyproject\.toml|ruff\.toml|\.pre-commit-config\.yaml)$
        exclude: ^(cli/|\.agents/|tasks/)
        pass_filenames: false
      - id: typecheck
        name: Check Pyrefly types
        entry: pdm run typecheck
        language: system
        files: ^(app/|extensions/|libs/|migrations/|scripts/|tests/|utils/|run\.py$|pyproject\.toml$|pdm\.lock$)
        pass_filenames: false
      - id: check-lock
        name: Check PDM lock
        entry: pdm run check:lock
        language: system
        files: ^(pyproject\.toml|pdm\.lock)$
        pass_filenames: false
      - id: lint-migrations
        name: Lint migration contract
        entry: pdm run lint:migrations
        language: system
        files: ^(alembic\.ini|migrations/|scripts/|tests/migrations/)
        pass_filenames: false
      - id: test-migrations
        name: Test migration contract
        entry: pdm run test:migrations
        language: system
        files: ^(alembic\.ini|migrations/|tests/migrations/)
        pass_filenames: false
